<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d7f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المسبحة">
<title>المسبحة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f8f5;--card:#fff;--fg:#10312a;--mute:#6b8a82;--line:#dcebe6;--bar:#e3f1ec;
  --t1:#18b893;--t2:#0b7a62;--lcd:#cbd9c4;--lcd-fg:#26362a;--lcd-on:#e2ffd6;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#07130f;--card:#0f221c;--fg:#e6f4ef;--mute:#8fb0a6;--line:#1b362d;--bar:#16302a;--lcd:#a9b9a3}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif}
body{display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:100%;max-width:440px;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 8px 20px rgba(11,122,98,.25)}
header h1{margin:0;font-size:20px;font-weight:800}
.today{font-size:13px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px}
.icon{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.card{background:var(--card);border-radius:20px;padding:14px 16px 16px;box-shadow:0 6px 18px rgba(16,49,42,.08);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.chip{background:var(--bar);color:var(--t2);border:0;border-radius:999px;padding:4px 12px;font:600 13px 'Cairo',system-ui,sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){.chip{color:#5fe0bf}}
.dhikr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0 10px}
.dhikr .txt{flex:1;text-align:center;font-family:'Amiri','Traditional Arabic',serif;font-weight:700;font-size:clamp(28px,8.5vw,38px);line-height:1.5;min-height:1.5em}
.nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--t2);font-size:18px;cursor:pointer}
@media (prefers-color-scheme:dark){.nav{color:#5fe0bf}}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t1),#5fe0bf);border-radius:99px;transition:width .2s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0}
.device{position:relative;width:min(80vw,310px);aspect-ratio:300/390;border-radius:48% 48% 40% 40%/30% 30% 46% 46%;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:inset 0 10px 18px rgba(255,255,255,.28),inset 0 -14px 24px rgba(0,0,0,.28),0 26px 40px rgba(11,122,98,.35);display:flex;flex-direction:column;align-items:center;padding-top:15%}
.lcd{width:76%;background:var(--lcd);border:6px solid #263634;border-radius:12px;padding:8px 6px;text-align:center;font:700 clamp(30px,10vw,40px) 'Courier New',ui-monospace,monospace;letter-spacing:.14em;color:var(--lcd-fg);box-shadow:inset 0 3px 8px rgba(0,0,0,.35);direction:ltr;transition:background .25s,box-shadow .25s}
.lcd.on{background:var(--lcd-on);box-shadow:inset 0 3px 8px rgba(0,0,0,.25),0 0 22px rgba(190,255,170,.75)}
.tools{display:flex;gap:18px;margin-top:6%}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.85);font-size:11px;font-weight:600}
.tool button{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(160deg,#27c9a3,#0d8a70);color:#fff;font-size:18px;cursor:pointer;box-shadow:inset 0 2px 3px rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.25);padding:0}
.tool button:active{transform:scale(.92)}
.tool button.lit{background:linear-gradient(160deg,#ffe28a,#f5a60b)}
.big{position:relative;margin-top:7%;width:34%;aspect-ratio:1;border-radius:50%;border:7px solid #fff;background:radial-gradient(circle at 35% 30%,#ffd96b,#f59e0b 70%);cursor:pointer;box-shadow:0 8px 16px rgba(0,0,0,.3),inset 0 -6px 10px rgba(180,90,0,.35);transition:transform .06s,box-shadow .06s;padding:0}
.big.press{transform:scale(.93);box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 -3px 6px rgba(180,90,0,.35)}
.big::after{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.55),transparent 60%)}
button:focus-visible{outline:3px solid #ffd25a;outline-offset:3px}
.done .bar i{background:linear-gradient(90deg,#f5a60b,#ffd25a)}
.hint{text-align:center;font-size:13px;color:var(--mute);margin:0}
.duaBtn{align-self:center;border:0;border-radius:999px;padding:10px 26px;font:800 17px 'Cairo',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 6px 14px rgba(11,122,98,.3);cursor:pointer}
.duaBtn:active{transform:scale(.96)}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.back.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:84vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);user-select:text;-webkit-user-select:text}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:20px;font-weight:800}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer;padding:0}
.sheet-list{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.dua{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.dua p{margin:0;font-family:'Amiri','Traditional Arabic',serif;font-weight:700;font-size:22px;line-height:1.9;color:var(--fg)}
.dua .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--mute)}
.dua .cp{border:0;background:var(--bar);color:var(--t2);border-radius:999px;padding:4px 12px;font:600 13px 'Cairo',system-ui,sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){.dua .cp{color:#5fe0bf}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="mute" aria-label="كتم الصوت">🔊</button>
    <h1>المسبحة</h1>
    <span class="today" id="today">اليوم: 0</span>
  </header>

  <section class="card" id="card" aria-live="polite">
    <div class="row">
      <button class="chip" id="goal" aria-label="تغيير الهدف">الهدف: 33</button>
      <span id="prog">0 / 33 (0%)</span>
    </div>
    <div class="dhikr">
      <button class="nav" id="next" aria-label="الذكر التالي">›</button>
      <div class="txt" id="txt"></div>
      <button class="nav" id="prev" aria-label="الذكر السابق">‹</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
  </section>

  <div class="stage">
    <div class="device">
      <div class="lcd" id="lcd" aria-label="العداد">00000</div>
      <div class="tools">
        <div class="tool"><button id="reset" aria-label="تصفير">↻</button>تصفير</div>
        <div class="tool"><button id="led" aria-label="إضاءة الشاشة">💡</button>إضاءة</div>
        <div class="tool"><button id="minus" aria-label="تراجع واحد">−</button>تراجع</div>
      </div>
      <button class="big" id="big" aria-label="سبّح"></button>
    </div>
  </div>
  <button class="duaBtn" id="duaOpen">🤲 أدعية</button>
  <p class="hint">اضغط الزر البرتقالي للعد، أو مسطرة المسافة في الكمبيوتر</p>
</div>

<div class="back" id="back">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="duaTitle">
    <div class="sheet-h"><h2 id="duaTitle">أدعية</h2><button class="close" id="duaClose" aria-label="إغلاق">✕</button></div>
    <div class="sheet-list" id="duaList"></div>
  </div>
</div>

<script>
(function(){
var DHIKR=['سُبْحَانَ اللَّهِ','الْحَمْدُ لِلَّهِ','اللَّهُ أَكْبَرُ','لَا إِلَٰهَ إِلَّا اللَّهُ','أَسْتَغْفِرُ اللَّهَ','لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ'];
var GOALS=[33,99,100,0];
var KEY='masbaha_v1';
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
var S={i:0,c:0,g:33,t:0,d:today(),led:0,mute:0};
try{var raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object')for(var k in S)if(k in raw)S[k]=raw[k]}catch(e){}
if(S.d!==today()){S.d=today();S.t=0}
if(S.i<0||S.i>=DHIKR.length)S.i=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var $=function(id){return document.getElementById(id)};
var lock=false;

/* sound */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when){
  if(S.mute)return;var a=ac();if(!a)return;
  var t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
function click(){tone(900,.05,'square',.05)}
function chime(){[660,880,1100,1320].forEach(function(f,i){tone(f,.35,'sine',.16,i*.11)})}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

function render(){
  var g=S.g,pct=g?Math.min(100,Math.round(S.c/g*100)):0;
  $('lcd').textContent=String(S.c).padStart(5,'0');
  $('lcd').classList.toggle('on',!!S.led);
  $('led').classList.toggle('lit',!!S.led);
  $('txt').textContent=DHIKR[S.i];
  $('goal').textContent='الهدف: '+(g||'مفتوح');
  $('prog').textContent=g?S.c+' / '+g+' ('+pct+'%)':S.c+' / ∞';
  $('fill').style.width=(g?pct:100)+'%';
  $('card').classList.toggle('done',g>0&&S.c>=g);
  $('today').textContent='اليوم: '+S.t;
  $('mute').textContent=S.mute?'🔇':'🔊';
}

function count(){
  if(lock)return;
  S.c++;S.t++;
  if(S.g&&S.c>=S.g){
    lock=true;render();save();chime();buzz([70,50,70,50,140]);
    setTimeout(function(){S.i=(S.i+1)%DHIKR.length;S.c=0;lock=false;render();save()},800);
  }else{
    click();buzz(12);render();save();
  }
}

var big=$('big');
big.addEventListener('pointerdown',function(e){e.preventDefault();ac();big.classList.add('press');count()});
['pointerup','pointerleave','pointercancel'].forEach(function(n){big.addEventListener(n,function(){big.classList.remove('press')})});
big.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!e.repeat){big.classList.add('press');count()}}});
big.addEventListener('keyup',function(){big.classList.remove('press')});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'&&document.activeElement===document.body&&!document.getElementById('back').classList.contains('show')){e.preventDefault();count()}
});

$('reset').addEventListener('click',function(){S.c=0;lock=false;render();save();tone(300,.12,'triangle',.1)});
$('minus').addEventListener('click',function(){if(S.c>0&&!lock){S.c--;if(S.t>0)S.t--;render();save();tone(400,.06,'triangle',.08)}});
$('led').addEventListener('click',function(){S.led=S.led?0:1;render();save()});
$('mute').addEventListener('click',function(){S.mute=S.mute?0:1;render();save();if(!S.mute){ac();tone(600,.08,'triangle',.12)}});
$('goal').addEventListener('click',function(){var n=(GOALS.indexOf(S.g)+1)%GOALS.length;S.g=GOALS[n];lock=false;render();save()});
function go(d){S.i=(S.i+d+DHIKR.length)%DHIKR.length;S.c=0;lock=false;render();save()}
$('next').addEventListener('click',function(){go(1)});
$('prev').addEventListener('click',function(){go(-1)});

/* duas */
var DUAS=[
['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','البقرة ٢٠١'],
['رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا','البقرة ٢٨٦'],
['رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ','آل عمران ٨'],
['رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ','الأعراف ٢٣'],
['حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ','التوبة ١٢٩'],
['رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ','إبراهيم ٤٠'],
['رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ','إبراهيم ٤١'],
['رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا','الإسراء ٢٤'],
['رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي','طه ٢٥-٢٦'],
['رَبِّ زِدْنِي عِلْمًا','طه ١١٤'],
['لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ','الأنبياء ٨٧'],
['رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا','الفرقان ٧٤'],
['يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ','من السنة'],
['اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ','من السنة'],
['اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ','من السنة'],
['اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ','من السنة']
];
var back=$('back'),opener=null;
var listEl=$('duaList');
DUAS.forEach(function(d){
  var box=document.createElement('div');box.className='dua';
  var p=document.createElement('p');p.textContent=d[0];
  var meta=document.createElement('div');meta.className='meta';
  var src=document.createElement('span');src.textContent=d[1];
  var cp=document.createElement('button');cp.className='cp';cp.textContent='نسخ';
  cp.addEventListener('click',function(){
    var txt=d[0];
    function ok(){cp.textContent='تم النسخ';setTimeout(function(){cp.textContent='نسخ'},1200)}
    try{navigator.clipboard.writeText(txt).then(ok,function(){})}catch(e){}
  });
  meta.appendChild(src);meta.appendChild(cp);box.appendChild(p);box.appendChild(meta);listEl.appendChild(box);
});
function openDua(){opener=document.activeElement;back.classList.add('show');listEl.scrollTop=0;$('duaClose').focus()}
function closeDua(){back.classList.remove('show');if(opener&&opener.focus)opener.focus()}
$('duaOpen').addEventListener('click',openDua);
$('duaClose').addEventListener('click',closeDua);
back.addEventListener('click',function(e){if(e.target===back)closeDua()});
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&back.classList.contains('show'))closeDua()});

render();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
